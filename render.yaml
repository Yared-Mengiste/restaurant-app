services:
  - type: web
    name: restaurant-app
    env: docker
    plan: free
    region: frankfurt

    # Build settings
    dockerfilePath: ./Dockerfile
    context: .

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://restaurant-app.onrender.com # Update this after deploy

      # --- Database (Neon Postgres) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-dawn-feather-ab21funs-pooler.eu-west-2.aws.neon.tech
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false # Set this in Render Dashboard for security
      - key: DB_SSLMODE
        value: require

      # --- Google Socialite ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://restaurant-app.onrender.com/auth/google-callback

      # --- Payment & App Keys ---
      - key: APP_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false

      # --- Drivers ---
      - key: SESSION_DRIVER
        value: database
      - key: FILESYSTEM_DISK
        value: public

    # Persistent disk for uploaded images
    disk:
      name: restaurant-storage
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1
    runtime: docker
