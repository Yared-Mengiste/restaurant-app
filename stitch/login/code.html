<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#111316",
              "primary-container": "#d9ae00",
              "tertiary-container": "#97b0ff",
              "error": "#ffb4ab",
              "secondary-container": "#474747",
              "tertiary": "#bfcdff",
              "primary-fixed-dim": "#efc11c",
              "on-tertiary-fixed": "#00174b",
              "surface": "#111316",
              "on-error-container": "#ffdad6",
              "inverse-on-surface": "#2f3034",
              "surface-container-lowest": "#0c0e11",
              "surface-container": "#1e2023",
              "on-tertiary": "#082b72",
              "surface-variant": "#333538",
              "surface-bright": "#37393d",
              "error-container": "#93000a",
              "on-tertiary-fixed-variant": "#27438a",
              "on-surface": "#e2e2e6",
              "on-background": "#e2e2e6",
              "on-secondary-fixed-variant": "#474747",
              "surface-container-low": "#1a1c1f",
              "primary": "#f8c927",
              "surface-tint": "#efc11c",
              "secondary-fixed-dim": "#c8c6c5",
              "surface-container-high": "#282a2d",
              "on-error": "#690005",
              "on-primary-fixed-variant": "#574400",
              "secondary-fixed": "#e4e2e1",
              "on-surface-variant": "#d0c5af",
              "on-secondary-fixed": "#1b1c1c",
              "background": "#111316",
              "outline": "#99907c",
              "tertiary-fixed": "#dbe1ff",
              "on-primary-container": "#554300",
              "primary-fixed": "#ffe089",
              "inverse-surface": "#e2e2e6",
              "inverse-primary": "#745b00",
              "on-tertiary-container": "#254188",
              "on-secondary": "#303030",
              "tertiary-fixed-dim": "#b4c5ff",
              "on-primary": "#3d2f00",
              "surface-container-highest": "#333538",
              "on-primary-fixed": "#241a00",
              "on-secondary-container": "#b6b5b4",
              "secondary": "#c8c6c5",
              "outline-variant": "#4d4635"
            },
            fontFamily: {
              "headline": ["Noto Serif"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(51, 53, 56, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopNavBar (Shared Component) - Rendered for brand identity but navigation links suppressed for login focus -->
<nav class="fixed top-0 w-full z-50 bg-[#111316] dark:bg-[#111316] flex justify-between items-center px-8 py-6 max-w-7xl mx-auto left-0 right-0">
<span class="font-serif italic text-2xl text-[#f8c927] dark:text-[#f8c927]">Lumière Reserve</span>
<div class="flex items-center gap-6">
<span class="font-sans font-medium tracking-tight text-gray-400 dark:text-gray-500 hover:text-[#f8c927] transition-colors duration-300 cursor-pointer">Help</span>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-4 pt-24 pb-12 relative overflow-hidden">
<!-- Abstract Atmospheric Elements -->
<div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-primary opacity-5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] bg-primary-container opacity-5 blur-[100px] rounded-full"></div>
<div class="w-full max-w-md z-10">
<!-- Login Container -->
<div class="glass-card rounded-xl p-8 md:p-12 border border-outline-variant/10 shadow-2xl">
<div class="text-center mb-10">
<h1 class="font-headline text-4xl md:text-5xl text-on-surface mb-3 tracking-tight">Welcome Back</h1>
<p class="font-body text-on-surface-variant text-sm tracking-wide">Enter your credentials to access your table.</p>
</div>
<!-- Social Sign In -->
<button class="w-full flex items-center justify-center gap-3 py-4 px-6 bg-surface-container-high hover:bg-surface-container-highest transition-all duration-300 rounded-full border border-outline-variant/20 group">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label text-sm font-semibold tracking-widest uppercase text-on-surface">Sign in with Google</span>
</button>
<!-- Divider -->
<div class="relative my-8 flex items-center">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink mx-4 font-headline italic text-on-surface-variant text-sm">or</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- Form -->
<form class="space-y-6">
<div class="space-y-2">
<label class="block font-label text-xs uppercase tracking-widest text-on-surface-variant ml-1" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b-2 border-surface-variant focus:ring-0 focus:border-primary text-on-surface font-body py-3 transition-colors placeholder:text-surface-variant/50" id="email" placeholder="maitre-d@lumiere.com" type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="block font-label text-xs uppercase tracking-widest text-on-surface-variant ml-1" for="password">Password</label>
<a class="text-[10px] uppercase tracking-widest text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-transparent border-0 border-b-2 border-surface-variant focus:ring-0 focus:border-primary text-on-surface font-body py-3 transition-colors placeholder:text-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full mt-8 bg-gradient-to-r from-primary to-primary-container text-on-primary font-label text-sm font-bold uppercase tracking-[0.15em] py-5 rounded-full shadow-lg hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
                        Sign In
                    </button>
</form>
<!-- Footer Link -->
<div class="mt-10 text-center">
<p class="font-body text-sm text-on-surface-variant">
                        New guest? 
                        <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4 ml-1" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Contextual Decorative Text -->
<p class="mt-8 text-center font-headline italic text-on-surface-variant/40 text-sm">Experience the art of nocturnal dining.</p>
</div>
</main>
<!-- Footer (Shared Component) -->
<footer class="w-full py-12 px-8 bg-[#1a1c1f] dark:bg-[#1a1c1f] mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center gap-4 w-full max-w-7xl mx-auto">
<span class="font-sans text-xs uppercase tracking-widest text-gray-500">© 2024 Lumière Reserve. An Editorial Dining Experience.</span>
<div class="flex gap-8">
<a class="font-sans text-xs uppercase tracking-widest text-gray-500 hover:text-gray-300 transition-colors" href="#">Privacy Policy</a>
<a class="font-sans text-xs uppercase tracking-widest text-gray-500 hover:text-gray-300 transition-colors" href="#">Terms of Service</a>
<a class="font-sans text-xs uppercase tracking-widest text-gray-500 hover:text-gray-300 transition-colors" href="#">Contact</a>
</div>
</div>
</footer>
</body></html>
